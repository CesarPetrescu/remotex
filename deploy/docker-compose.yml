name: remotex

services:
  postgres:
    # Keep the pgvector image: the existing named volume was initialized
    # by it. Plain postgres:16 would also mount this PG16 cluster (the
    # pgvector image is postgres:16 + the extension), but staying on
    # pgvector/pgvector:pg16 guarantees zero volume-compat risk now that
    # no vector columns remain. Only inventory (users/hosts/sessions) lives
    # here.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remotex}
      POSTGRES_USER: ${POSTGRES_USER:-remotex}
      # Default kept as the original SEARCH_POSTGRES_PASSWORD value so the
      # already-initialized named volume still authenticates.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remotex-search}
    volumes:
      - search-data:/var/lib/postgresql/data
    networks:
      - remotex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remotex} -d ${POSTGRES_DB:-remotex}"]
      interval: 10s
      timeout: 5s
      retries: 5

  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    image: remotex/relay:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Etc/UTC}
      RELAY_CLIENT_RECONNECT_GRACE_SECONDS: ${RELAY_CLIENT_RECONNECT_GRACE_SECONDS:-75}
      # How long a POSTed session reservation survives with no client
      # attached before the relay reaps it (row, overrides, thread index).
      RELAY_SESSION_RESERVATION_TTL_SECONDS: ${RELAY_SESSION_RESERVATION_TTL_SECONDS:-600}
      # Largest file the relay will proxy in either direction. The HTTP
      # body cap and both WebSocket frame caps are derived from it, so
      # raising it also raises per-connection memory.
      REMOTEX_MAX_FILE_BYTES: ${REMOTEX_MAX_FILE_BYTES:-26214400}
      # Demo user/bridge tokens are public (they live in this repo), so
      # seeding stays OFF here. Only ever turn it on for a throwaway box.
      RELAY_SEED_DEMO: ${RELAY_SEED_DEMO:-0}
      # Rate limiting keys on the TCP peer, which is the proxy container
      # for every caller behind Caddy or SparkTunnel — one shared bucket.
      # Set RELAY_TRUST_PROXY=1 in .env for either proxy mode so the relay
      # reads X-Forwarded-For instead. Never set it when the relay is exposed
      # directly: the header is caller-supplied.
      RELAY_TRUST_PROXY: ${RELAY_TRUST_PROXY:-0}
      # Inventory (users/hosts/sessions) lives in the Postgres container.
      RELAY_DATABASE_URL: postgresql://${POSTGRES_USER:-remotex}:${POSTGRES_PASSWORD:-remotex-search}@postgres:5432/${POSTGRES_DB:-remotex}
    ports:
      # Bind to localhost only by default; front with Caddy (profile `tls`)
      # or your own reverse proxy for anything public. Override the host
      # port with RELAY_HOST_PORT=… if :8080 is already taken.
      - "${RELAY_HOST_BIND:-127.0.0.1}:${RELAY_HOST_PORT:-8080}:8080"
    volumes:
      # Scratch volume kept from pre-Postgres installs, where inventory
      # lived in /data/relay.db (SQLite). Nothing reads or imports it any
      # more — inventory is Postgres-only. Kept so an upgraded box does
      # not lose the old file before someone has copied anything out.
      - relay-data:/data
    networks:
      - remotex
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      REMOTEX_HOSTNAME: ${REMOTEX_HOSTNAME:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-you@example.invalid}
    networks:
      - remotex

  sparktunnel:
    profiles: ["sparktunnel"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sparktunnel
      args:
        SPARK_TUNNEL_DOWNLOAD_URL: ${SPARK_TUNNEL_DOWNLOAD_URL:-https://webhost.photonspark.com/api/v1/downloads/spark-tunnel/linux/amd64}
        SPARK_TUNNEL_SHA256: ${SPARK_TUNNEL_SHA256:-e57b3293f8c4dcb2a55e0a5fbd44e040e87b6b55be7b99222c287248e422d6b7}
    image: remotex/sparktunnel:0.2.0
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      SPARK_TUNNEL_SERVER: ${SPARK_TUNNEL_SERVER:-https://webhost.photonspark.com}
      SPARK_TUNNEL_TOKEN: ${SPARK_TUNNEL_TOKEN:-}
      # Use the relay's private Compose address. The host port is not part
      # of the tunnel path and can stay bound to loopback.
      SPARK_TUNNEL_TARGET: ${SPARK_TUNNEL_TARGET:-http://relay:8080}
    networks:
      - remotex
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  search-data:
  relay-data:
  caddy-data:
  caddy-config:

networks:
  remotex:
    driver: bridge
